name: Release Build & Upload

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-amd64:
    name: Build Linux amd64 (Self-Hosted Runner)
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        continue-on-error: true
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        continue-on-error: true
        with:
          go-version: '1.23'

      - name: Install Linux GUI Dependencies
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libwebkit2gtk-4.0-dev || true
          fi

      - name: Build Frontend
        run: |
          cd frontend
          yarn install || npm install
          yarn build || npm run build

      - name: Build & Package Linux amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="0.0.43"; fi
          mkdir -p bin release_dist
          go build -tags production -trimpath -ldflags="-w -s -X cursor/internal/buildinfo.Version=${VERSION}" -o bin/cursor-byok .
          tar -czf "release_dist/cursor-byok-${VERSION}-linux-amd64.tar.gz" -C bin cursor-byok

      - name: Generate update.json Manifest
        run: |
          go run ./scripts/release manifest \
            -config ./build/config.yml \
            -assets-dir release_dist \
            -out release_dist/update.json \
            -repo "${{ github.repository }}" \
            -base-name cursor-byok \
            -notes release-notes.md || true

      - name: Upload Linux Assets and Manifest to Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
