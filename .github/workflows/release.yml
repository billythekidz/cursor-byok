name: Release Build & Upload

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-assets:
    name: Build Linux and Windows amd64 release assets
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install Linux GUI Dependencies
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          fi
          pkg-config --exists gtk+-3.0 webkit2gtk-4.1 gdk-3.0 gio-unix-2.0

      - name: Build Frontend
        run: |
          cd frontend
          yarn install --frozen-lockfile
          yarn build

      - name: Build & Package Linux and Windows amd64
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="$(go run ./scripts/release version -config ./build/config.yml)"
          fi
          CONFIG_VERSION="$(go run ./scripts/release version -config ./build/config.yml)"
          if [ "$VERSION" != "$CONFIG_VERSION" ]; then
            echo "Tag version $VERSION does not match build/config.yml version $CONFIG_VERSION" >&2
            exit 1
          fi
          BINARY_NAME="$(go run ./scripts/release binary-name -config ./build/artifacts.yml)"
          mkdir -p bin release_dist

          wails3 generate icons -input build/appicon.png -macfilename build/darwin/icons.icns -windowsfilename build/windows/icon.ico
          wails3 generate syso -arch amd64 -icon build/windows/icon.ico -manifest build/windows/wails.exe.manifest -info build/windows/info.json -out wails_windows_amd64.syso

          python scripts/build/openserp_cache.py \
            --source-dir submodules/openserp \
            --cache-dir bin/.cache/openserp/linux-amd64 \
            --output internal/search/openserp/assets/openserp-linux-amd64 \
            --goos linux \
            --goarch amd64
          GOOS=linux GOARCH=amd64 CGO_ENABLED=1 go build -tags production,openserp_embedded -trimpath -buildvcs=false -ldflags="-w -s -X cursor/internal/buildinfo.Version=${VERSION}" -o "bin/${BINARY_NAME}" .
          tar -czf "release_dist/${BINARY_NAME}-${VERSION}-linux-amd64.tar.gz" -C bin "${BINARY_NAME}"

          python scripts/build/openserp_cache.py \
            --source-dir submodules/openserp \
            --cache-dir bin/.cache/openserp/windows-amd64 \
            --output internal/search/openserp/assets/openserp-windows-amd64 \
            --goos windows \
            --goarch amd64
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -tags production,openserp_embedded -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui -X cursor/internal/buildinfo.Version=${VERSION}" -o "bin/${BINARY_NAME}.exe"
          BINARY_NAME="$BINARY_NAME" python - <<'PY'
          import os
          import pathlib
          import zipfile

          version = pathlib.Path("build/config.yml").read_text(encoding="utf-8").split('version: "', 1)[1].split('"', 1)[0]
          binary_name = os.environ["BINARY_NAME"]
          archive = pathlib.Path(f"release_dist/{binary_name}-{version}-windows-amd64.zip")
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
              zf.write(f"bin/{binary_name}.exe", f"{binary_name}.exe")
          PY

      - name: Generate update.json Manifest
        run: |
          go run ./scripts/release manifest \
            -config ./build/config.yml \
            -assets-dir release_dist \
            -out release_dist/update.json \
            -repo "${{ github.repository }}" \
            -base-name "$(go run ./scripts/release binary-name -config ./build/artifacts.yml)" \
            -notes release-notes.md

      - name: Upload Release Assets and Manifest
        uses: softprops/action-gh-release@v2
        with:
          files: release_dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
