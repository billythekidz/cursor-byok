version: "3"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "Cursor Helper"
  BIN_DIR: "bin"
  BINARY_NAME:
    sh: 'python -c "import pathlib; print(pathlib.Path(\"build/artifacts.yml\").read_text().split(\": \", 1)[1].strip().strip(chr(34)))"'
  APP_VERSION:
    sh: 'go run ./scripts/release version -config ./build/config.yml'
  RELEASE_REPO: "billythekidz/cursor-byok"
  RELEASE_BASE_NAME: '{{.BINARY_NAME}}'
  RELEASE_SOURCE_PATH: "release-notes.md"
  RELEASE_DIR: '{{.BIN_DIR}}/release/{{.APP_VERSION}}'
  RELEASE_NOTES_PATH: '{{.RELEASE_DIR}}/.release-notes.md'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  SCAN: '{{.SCAN | default "false"}}'
  CURRENT_WINDOWS_ARCH: '{{if eq ARCH "386"}}386{{else}}amd64{{end}}'
  CURRENT_WINDOWS_PACKAGE: '{{if eq .CURRENT_WINDOWS_ARCH "386"}}{{.BINARY_NAME}}-windows-386{{else}}{{.BINARY_NAME}}-windows-amd64{{end}}'
  CURRENT_DARWIN_PACKAGE: '{{if eq ARCH "arm64"}}{{.BINARY_NAME}}-macos-arm64{{else}}{{.BINARY_NAME}}-macos-amd64{{end}}'
  CURRENT_LINUX_ARCH: "amd64"
  CURRENT_LINUX_PACKAGE: '{{.BINARY_NAME}}-linux-amd64'

tasks:
  build:
    summary: Build distribution package for current system
    preconditions:
      - sh: '[ "{{OS}}" = "darwin" ] || [ "{{OS}}" = "windows" ] || [ "{{OS}}" = "linux" ]'
        msg: "task build is only supported on macOS, Windows, or Linux"
    cmds:
      - task: clean:dist
      - task: build:current

  run:
    summary: Run current system version
    cmds:
      - task: "{{OS}}:run"

  build:all:
    summary: Build all macOS/Windows distribution packages (Linux requires building on native Linux host)
    preconditions:
      - sh: '[ "{{OS}}" = "darwin" ]'
        msg: "task build:all is only supported on macOS; Linux requires building on native Linux host."
    cmds:
      - task: clean:dist
      - task: build:darwin:arm64
      - task: build:darwin:amd64
      - task: build:windows:386
      - task: build:windows:amd64

  build:current:
    internal: true
    cmds:
      - task: '{{if eq OS "darwin"}}build:darwin:current{{else if eq OS "linux"}}build:linux:current{{else}}build:windows:current{{end}}'

  build:darwin:current:
    internal: true
    cmds:
      - task: darwin:package:dmg
        vars:
          ARCH: '{{ARCH}}'
          BINARY_NAME: '{{.BINARY_NAME}}'
          OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}'
          EXECUTABLE_NAME: '{{.BINARY_NAME}}'
          APP_BUNDLE: '{{.CURRENT_DARWIN_PACKAGE}}.app'
          DMG_NAME: '{{.CURRENT_DARWIN_PACKAGE}}.dmg'
          SCAN: '{{.SCAN}}'

  build:darwin:arm64:
    internal: false
    cmds:
      - task: darwin:package:dmg
        vars:
          ARCH: arm64
          BINARY_NAME: '{{.BINARY_NAME}}'
          OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}'
          EXECUTABLE_NAME: '{{.BINARY_NAME}}'
          APP_BUNDLE: '{{.BINARY_NAME}}-macos-arm64.app'
          DMG_NAME: '{{.BINARY_NAME}}-macos-arm64.dmg'
          SCAN: '{{.SCAN}}'

  build:darwin:amd64:
    internal: true
    cmds:
      - task: darwin:package:dmg
        vars:
          ARCH: amd64
          BINARY_NAME: '{{.BINARY_NAME}}'
          OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}'
          EXECUTABLE_NAME: '{{.BINARY_NAME}}'
          APP_BUNDLE: '{{.BINARY_NAME}}-macos-amd64.app'
          DMG_NAME: '{{.BINARY_NAME}}-macos-amd64.dmg'
          SCAN: '{{.SCAN}}'

  build:windows:current:
    internal: true
    cmds:
      - task: windows:create:zip
        vars:
          ARCH: '{{.CURRENT_WINDOWS_ARCH}}'
          OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}.exe'
          ZIP_NAME: '{{.CURRENT_WINDOWS_PACKAGE}}.zip'
          SCAN: '{{.SCAN}}'

  build:windows:386:
    internal: true
    cmds:
      - task: windows:create:zip
        vars:
          ARCH: 386
          OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}.exe'
          ZIP_NAME: '{{.BINARY_NAME}}-windows-386.zip'
          SCAN: '{{.SCAN}}'

  build:windows:amd64:
    cmds:
      - task: windows:create:zip
        vars:
          ARCH: amd64
          OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}.exe'
          ZIP_NAME: '{{.BINARY_NAME}}-windows-amd64.zip'
          SCAN: '{{.SCAN}}'

  build:linux:current:
    internal: true
    cmds:
      - task: linux:package:archive
        vars:
          ARCH: '{{.CURRENT_LINUX_ARCH}}'
          BINARY_NAME: '{{.BINARY_NAME}}'
          OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}'
          ARCHIVE_BINARY_NAME: '{{.BINARY_NAME}}'
          ARCHIVE_PATH: '{{.BIN_DIR}}/{{.CURRENT_LINUX_PACKAGE}}.tar.gz'
          SCAN: '{{.SCAN}}'

  build:linux:amd64:
    cmds:
      - task: linux:package:archive
        vars:
          ARCH: amd64
          BINARY_NAME: '{{.BINARY_NAME}}'
          OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}'
          ARCHIVE_BINARY_NAME: '{{.BINARY_NAME}}'
          ARCHIVE_PATH: '{{.BIN_DIR}}/{{.BINARY_NAME}}-linux-amd64.tar.gz'
          SCAN: '{{.SCAN}}'

  cursor-tab-server:docker:amd64:
    summary: Build linux/amd64 Docker image for cursor-tab-server and save to cursor-tab-server directory
    vars:
      IMAGE_NAME: '{{.IMAGE_NAME | default "cursor-tab-server:linux-amd64"}}'
      IMAGE_TAR: '{{.IMAGE_TAR | default "cursor-tab-server/cursor-tab-server-linux-amd64.tar"}}'
      CONTEXT_DIR: cursor-tab-server
      DOCKERFILE: cursor-tab-server/Dockerfile
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "No available Docker daemon detected, please start Docker first."
      - sh: test -f "{{.DOCKERFILE}}"
        msg: "cursor-tab-server/Dockerfile not found."
      - sh: test -f "{{.CONTEXT_DIR}}/go.mod"
        msg: "cursor-tab-server/go.mod not found."
    cmds:
      - mkdir -p "{{.CONTEXT_DIR}}"
      - docker build --platform linux/amd64 -t "{{.IMAGE_NAME}}" -f "{{.DOCKERFILE}}" "{{.CONTEXT_DIR}}"
      - docker save "{{.IMAGE_NAME}}" -o "{{.IMAGE_TAR}}"
      - ls -lh "{{.IMAGE_TAR}}"

  clean:dist:
    internal: true
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - rm -f "{{.BIN_DIR}}/{{.BINARY_NAME}}-macos-arm64.dmg" "{{.BIN_DIR}}/{{.BINARY_NAME}}-macos-amd64.dmg" "{{.BIN_DIR}}/{{.BINARY_NAME}}-windows-386.zip" "{{.BIN_DIR}}/{{.BINARY_NAME}}-windows-amd64.zip" "{{.BIN_DIR}}/{{.BINARY_NAME}}-linux-amd64.tar.gz"
      - rm -f "{{.BIN_DIR}}/{{.BINARY_NAME}}" "{{.BIN_DIR}}/{{.BINARY_NAME}}.exe"
      - rm -f "{{.BIN_DIR}}/macos-arm64" "{{.BIN_DIR}}/macos-intel" "{{.BIN_DIR}}/windows-32.exe" "{{.BIN_DIR}}/windows-64.exe" "{{.BIN_DIR}}/linux-amd64" "{{.BIN_DIR}}/cursor-byok-windows-amd64.exe" "{{.BIN_DIR}}/cursor-byok-linux-amd64" "{{.BIN_DIR}}/cursor-release-macos-arm64" "{{.BIN_DIR}}/cursor-release-macos-amd64" "{{.BIN_DIR}}/cursor-release-linux-amd64" "{{.BIN_DIR}}/Cursor Helper" "{{.BIN_DIR}}/Cursor Helper.exe"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
      - rm -f "internal/search/openserp/assets/openserp-windows-386" "internal/search/openserp/assets/openserp-windows-amd64" "internal/search/openserp/assets/openserp-windows-arm64" "internal/search/openserp/assets/openserp-darwin-amd64" "internal/search/openserp/assets/openserp-darwin-arm64" "internal/search/openserp/assets/openserp-linux-amd64" "internal/search/openserp/assets/openserp-linux-arm64" "internal/search/openserp/assets/openserp-linux-386"
      - rm -rf "{{.BIN_DIR}}/{{.BINARY_NAME}}-macos-arm64.app" "{{.BIN_DIR}}/{{.BINARY_NAME}}-macos-amd64.app" "{{.BIN_DIR}}/{{.APP_NAME}}.app" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"

  clean:openserp:
    summary: Remove cached OpenSERP sidecars and force their next rebuild
    cmds:
      - rm -rf "{{.BIN_DIR}}/.cache/openserp"
      - rm -f "internal/search/openserp/assets/openserp-windows-386" "internal/search/openserp/assets/openserp-windows-amd64" "internal/search/openserp/assets/openserp-windows-arm64" "internal/search/openserp/assets/openserp-darwin-amd64" "internal/search/openserp/assets/openserp-darwin-arm64" "internal/search/openserp/assets/openserp-linux-amd64" "internal/search/openserp/assets/openserp-linux-arm64" "internal/search/openserp/assets/openserp-linux-386"

  dev:
    summary: Start dev mode (foreground, terminal will remain occupied)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  ads:install:
    summary: Install ad page dependencies
    dir: '{{.TASKFILE_DIR}}/ads-page'
    sources:
      - package.json
      - yarn.lock
    generates:
      - node_modules
    cmds:
      - yarn install --frozen-lockfile

  ads:dev:
    summary: Start ad page dev service (http://127.0.0.1:5174/ad/)
    dir: '{{.TASKFILE_DIR}}/ads-page'
    deps:
      - task: ads:install
    cmds:
      - yarn dev

  ads:build:
    summary: Build ad ZIP artifact
    dir: '{{.TASKFILE_DIR}}/ads-page'
    deps:
      - task: ads:install
    cmds:
      - yarn build

  setup:docker:
    summary: Build Linux cross-compilation Docker image
    cmds:
      - task: common:setup:docker

  release:clean:
    summary: Clean release directory for current version
    cmds:
      - rm -rf "{{.RELEASE_DIR}}"
      - mkdir -p "{{.RELEASE_DIR}}"

  release:ensure:dir:
    internal: true
    cmds:
      - mkdir -p "{{.RELEASE_DIR}}"

  release:notes:
    summary: Generate release notes file for current version from release-notes.md (README.md is only for public repo sync)
    internal: true
    preconditions:
      - sh: test -f "{{.RELEASE_SOURCE_PATH}}"
        msg: "release-notes.md not found, please create release log file first."
      - sh: test -n "$(tr -d '[:space:]' < "{{.RELEASE_SOURCE_PATH}}")"
        msg: "release-notes.md cannot be empty, please fill in release log first."
    cmds:
      - go run ./scripts/release notes -config ./build/config.yml -out "{{.RELEASE_NOTES_PATH}}" -source "{{.RELEASE_SOURCE_PATH}}"

  release:build:macos:arm64:
    cmds:
      - task: darwin:package:archive
        vars:
          ARCH: arm64
          BINARY_NAME: '{{.BINARY_NAME}}'
          OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}'
          APP_BUNDLE: '{{.APP_NAME}}.app'
          EXECUTABLE_NAME: '{{.BINARY_NAME}}'
          ARCHIVE_PATH: '{{.RELEASE_DIR}}/{{.RELEASE_BASE_NAME}}-{{.APP_VERSION}}-macos-arm64.tar.gz'
          SCAN: '{{.SCAN}}'

  release:build:macos:amd64:
    internal: true
    cmds:
      - task: darwin:package:archive
        vars:
          ARCH: amd64
          BINARY_NAME: '{{.BINARY_NAME}}'
          OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}'
          APP_BUNDLE: '{{.APP_NAME}}.app'
          EXECUTABLE_NAME: '{{.BINARY_NAME}}'
          ARCHIVE_PATH: '{{.RELEASE_DIR}}/{{.RELEASE_BASE_NAME}}-{{.APP_VERSION}}-macos-amd64.tar.gz'
          SCAN: '{{.SCAN}}'

  release:build:windows:amd64:
    cmds:
      - task: windows:create:zip
        vars:
          ARCH: amd64
          OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}.exe'
          ZIP_NAME: 'release/{{.APP_VERSION}}/{{.RELEASE_BASE_NAME}}-{{.APP_VERSION}}-windows-amd64.zip'
          SCAN: '{{.SCAN}}'

  release:build:linux:amd64:
    cmds:
      - task: linux:package:archive
        vars:
          ARCH: amd64
          BINARY_NAME: '{{.BINARY_NAME}}'
          OUTPUT: '{{.BIN_DIR}}/{{.BINARY_NAME}}'
          ARCHIVE_BINARY_NAME: '{{.BINARY_NAME}}'
          ARCHIVE_PATH: '{{.RELEASE_DIR}}/{{.RELEASE_BASE_NAME}}-{{.APP_VERSION}}-linux-amd64.tar.gz'
          SCAN: '{{.SCAN}}'

  release:manifest:
    summary: Generate update.json
    internal: true
    cmds:
      - go run ./scripts/release manifest -config ./build/config.yml -assets-dir "{{.RELEASE_DIR}}" -out "{{.RELEASE_DIR}}/update.json" -repo "{{.RELEASE_REPO}}" -base-name "{{.BINARY_NAME}}" -notes "{{.RELEASE_NOTES_PATH}}"

  release:prepare:
    summary: Generate corresponding release assets on current host
    preconditions:
      - sh: '[ "{{OS}}" = "darwin" ] || [ "{{OS}}" = "linux" ]'
        msg: "release:prepare is only supported on macOS or Linux."
      - sh: wails3 version >/dev/null 2>&1
        msg: "wails3 not detected, please install Wails v3 CLI first."
    cmds:
      - task: '{{if eq OS "darwin"}}release:prepare:darwin{{else}}release:prepare:linux{{end}}'

  release:prepare:darwin:
    summary: Generate macOS/Windows/Linux release assets on macOS
    preconditions:
      - sh: '[ "{{OS}}" = "darwin" ]'
        msg: "release:prepare:darwin is only supported on macOS."
      - sh: wails3 version >/dev/null 2>&1
        msg: "wails3 not detected, please install Wails v3 CLI first."
    cmds:
      - task: release:clean
      - task: common:update:build-assets
      - task: release:notes
      - task: release:build:macos:arm64
      - task: release:build:macos:amd64
      - task: release:build:windows:amd64
      - task: release:build:linux:amd64

  release:prepare:linux:
    summary: Generate Linux release assets on current host
    preconditions:
      - sh: '[ "{{OS}}" = "linux" ] || [ "{{OS}}" = "darwin" ]'
        msg: "release:prepare:linux is currently only supported on Linux or macOS."
      - sh: wails3 version >/dev/null 2>&1
        msg: "wails3 not detected, please install Wails v3 CLI first."
    cmds:
      - task: release:ensure:dir
      - task: common:update:build-assets
      - task: release:notes
      - task: release:build:linux:amd64

  release:verify:assets:
    summary: Verify release notes and at least one package for current version
    preconditions:
      - sh: test -f "{{.RELEASE_NOTES_PATH}}"
        msg: "Release notes not found, please run corresponding release:prepare task first."
      - sh: 'test -f "{{.RELEASE_DIR}}/{{.RELEASE_BASE_NAME}}-{{.APP_VERSION}}-macos-arm64.tar.gz" || test -f "{{.RELEASE_DIR}}/{{.RELEASE_BASE_NAME}}-{{.APP_VERSION}}-macos-amd64.tar.gz" || test -f "{{.RELEASE_DIR}}/{{.RELEASE_BASE_NAME}}-{{.APP_VERSION}}-windows-amd64.zip" || test -f "{{.RELEASE_DIR}}/{{.RELEASE_BASE_NAME}}-{{.APP_VERSION}}-linux-amd64.tar.gz"'
        msg: "No release package found for the current version."
    cmds:
      - echo "release assets verified"

  release:verify:assets:complete:
    summary: Verify all four platform packages for current version
    deps:
      - task: release:verify:assets
    preconditions:
      - sh: test -f "{{.RELEASE_DIR}}/{{.RELEASE_BASE_NAME}}-{{.APP_VERSION}}-macos-arm64.tar.gz"
        msg: "Missing macOS arm64 release asset."
      - sh: test -f "{{.RELEASE_DIR}}/{{.RELEASE_BASE_NAME}}-{{.APP_VERSION}}-macos-amd64.tar.gz"
        msg: "Missing macOS amd64 release asset."
      - sh: test -f "{{.RELEASE_DIR}}/{{.RELEASE_BASE_NAME}}-{{.APP_VERSION}}-windows-amd64.zip"
        msg: "Missing Windows amd64 release asset."
      - sh: test -f "{{.RELEASE_DIR}}/{{.RELEASE_BASE_NAME}}-{{.APP_VERSION}}-linux-amd64.tar.gz"
        msg: "Missing Linux amd64 release asset."
    cmds:
      - echo "all release assets verified"

  release:sync:readme:
    summary: Sync README to public release repo (release log source is fixed to release-notes.md)
    internal: true
    env:
      GH_PAGER: cat
      GIT_PAGER: cat
      PAGER: cat
    preconditions:
      - sh: gh --version >/dev/null 2>&1
        msg: "gh not detected, please install GitHub CLI first."
      - sh: gh auth token >/dev/null 2>&1
        msg: "gh not logged in, please run gh auth login first."
    cmds:
      - |
        python - <<'PY'
        import base64
        import json
        import pathlib
        import subprocess
        import sys
        import time

        RETRYABLE_TOKENS = ("EOF", "timeout", "TLS", "temporarily unavailable", "connection reset", "connection refused")

        def run_gh(cmd, *, input_text=None, allow_404=False, retries=4):
            last = None
            for attempt in range(1, retries + 1):
                completed = subprocess.run(
                    cmd,
                    input=input_text,
                    text=True,
                    capture_output=True,
                )
                if completed.returncode == 0:
                    return completed
                stderr = (completed.stderr or "").strip()
                stdout = (completed.stdout or "").strip()
                combined = f"{stderr}\n{stdout}".strip()
                if allow_404 and "404" in combined:
                    return completed
                last = completed
                if not any(token.lower() in combined.lower() for token in RETRYABLE_TOKENS):
                    return completed
                if attempt < retries:
                    time.sleep(min(2 ** (attempt - 1), 5))
            return last

        repo = "{{.RELEASE_REPO}}"
        readme_path = pathlib.Path("README.md")
        content = readme_path.read_bytes()
        encoded = base64.b64encode(content).decode("ascii")

        get_cmd = [
            "gh", "api",
            f"repos/{repo}/contents/README.md",
        ]
        result = run_gh(get_cmd, allow_404=True)

        payload = {
            "message": "docs: sync README from source repo",
            "content": encoded,
            "branch": "main",
        }

        if result.returncode == 0:
            existing = json.loads(result.stdout)
            existing_content = base64.b64decode(existing["content"])
            if existing_content == content:
                sys.exit(0)
            payload["sha"] = existing["sha"]

        put_cmd = [
            "gh", "api",
            f"repos/{repo}/contents/README.md",
            "--method", "PUT",
            "--input", "-",
        ]
        completed = run_gh(put_cmd, input_text=json.dumps(payload))
        if completed.returncode != 0 and completed.stderr:
            sys.stderr.write(completed.stderr)
        sys.exit(completed.returncode)
        PY

  release:github:
    summary: Publish current version to GitHub Releases
    env:
      GH_PAGER: cat
      GIT_PAGER: cat
      PAGER: cat
    preconditions:
      - sh: gh --version >/dev/null 2>&1
        msg: "gh not detected, please install GitHub CLI first."
      - sh: gh auth token >/dev/null 2>&1
        msg: "gh not logged in, please run gh auth login first."
    cmds:
      - task: release:verify:assets
      - task: release:manifest
      - task: release:sync:readme
      - |
        python - <<'PY'
        import mimetypes
        import json
        import pathlib
        import subprocess
        import sys
        import time

        RETRYABLE_TOKENS = ("EOF", "timeout", "TLS", "temporarily unavailable", "connection reset", "connection refused")

        def run_gh(cmd, *, input_text=None, allow_404=False, retries=4):
            last = None
            for attempt in range(1, retries + 1):
                completed = subprocess.run(
                    cmd,
                    input=input_text,
                    text=True,
                    capture_output=True,
                )
                if completed.returncode == 0:
                    return completed
                stderr = (completed.stderr or "").strip()
                stdout = (completed.stdout or "").strip()
                combined = f"{stderr}\n{stdout}".strip()
                if allow_404 and "404" in combined:
                    return completed
                last = completed
                if not any(token.lower() in combined.lower() for token in RETRYABLE_TOKENS):
                    return completed
                if attempt < retries:
                    time.sleep(min(2 ** (attempt - 1), 5))
            return last

        repo = "{{.RELEASE_REPO}}"
        version = "{{.APP_VERSION}}"
        tag = f"v{version}"
        notes = pathlib.Path("{{.RELEASE_NOTES_PATH}}").read_text(encoding="utf-8")
        assets = sorted([
            pathlib.Path("{{.RELEASE_DIR}}/update.json"),
            *pathlib.Path("{{.RELEASE_DIR}}").glob("*.tar.gz"),
            *pathlib.Path("{{.RELEASE_DIR}}").glob("*.zip"),
        ])

        get_cmd = [
            "gh", "api",
            f"repos/{repo}/releases/tags/{tag}",
        ]
        result = run_gh(get_cmd, allow_404=True)

        payload = {
            "tag_name": tag,
            "target_commitish": "main",
            "name": tag,
            "body": notes,
            "draft": False,
            "prerelease": False,
        }

        if result.returncode == 0:
            release = json.loads(result.stdout)
            release_id = release["id"]
            edit_cmd = [
                "gh", "api",
                f"repos/{repo}/releases/{release_id}",
                "--method", "PATCH",
                "--input", "-",
            ]
            completed = run_gh(edit_cmd, input_text=json.dumps(payload))
            if completed.returncode != 0:
                if completed.stderr:
                    sys.stderr.write(completed.stderr)
                sys.exit(completed.returncode)
            refreshed = run_gh(get_cmd)
            if refreshed.returncode != 0:
                if refreshed.stderr:
                    sys.stderr.write(refreshed.stderr)
                sys.exit(refreshed.returncode)
            release = json.loads(refreshed.stdout)
        else:
            create_cmd = [
                "gh", "api",
                f"repos/{repo}/releases",
                "--method", "POST",
                "--input", "-",
            ]
            completed = run_gh(create_cmd, input_text=json.dumps(payload))
            if completed.returncode != 0:
                sys.stderr.write(completed.stderr)
                sys.exit(completed.returncode)
            release = json.loads(completed.stdout)

        upload_url = release["upload_url"].split("{", 1)[0]
        existing = {asset["name"]: asset["id"] for asset in release.get("assets", [])}

        for asset in assets:
            name = asset.name
            if name in existing:
                delete_cmd = [
                    "gh", "api",
                    f"repos/{repo}/releases/assets/{existing[name]}",
                    "--method", "DELETE",
                ]
                deleted = run_gh(delete_cmd)
                if deleted.returncode != 0:
                    if deleted.stderr:
                        sys.stderr.write(deleted.stderr)
                    sys.exit(deleted.returncode)

            content_type = mimetypes.guess_type(name)[0] or "application/octet-stream"
            upload_cmd = [
                "gh", "api",
                f"{upload_url}?name={name}",
                "--method", "POST",
                "--header", f"Content-Type: {content_type}",
                "--input", str(asset),
            ]
            uploaded = run_gh(upload_cmd)
            if uploaded.returncode != 0:
                if uploaded.stderr:
                    sys.stderr.write(uploaded.stderr)
                sys.exit(uploaded.returncode)
        PY
