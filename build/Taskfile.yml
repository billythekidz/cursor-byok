version: "3"

vars:
  ROOT_DIR:
    sh: 'cd "{{.TASKFILE_DIR}}/.." && pwd'
  BUILD_DIR:
    sh: 'cd "{{.TASKFILE_DIR}}" && pwd'

tasks:
  build:openserp:
    summary: Build the OpenSERP sidecar for the target platform
    internal: true
    dir: '{{.ROOT_DIR}}/submodules/openserp'
    vars:
      TARGET_GOOS: '{{.GOOS | default OS}}'
      TARGET_ARCH: '{{.ARCH | default ARCH}}'
      EXTENSION: '{{if eq .TARGET_GOOS "windows"}}.exe{{end}}'
      OUTPUT: '{{.OUTPUT | default (printf "%s/openserp-%s%s" .BIN_DIR .TARGET_ARCH .EXTENSION)}}'
      CACHE_DIR: '{{.ROOT_DIR}}/{{.BIN_DIR}}/.cache/openserp/{{.TARGET_GOOS}}-{{.TARGET_ARCH}}'
    cmds:
      - mkdir -p "{{.ROOT_DIR}}/{{.BIN_DIR}}"
      - mkdir -p "{{.ROOT_DIR}}/internal/search/openserp/assets"
      - python "{{.ROOT_DIR}}/scripts/build/openserp_cache.py" --source-dir "{{.ROOT_DIR}}/submodules/openserp" --cache-dir "{{.CACHE_DIR}}" --output "{{.ROOT_DIR}}/{{.OUTPUT}}" --goos "{{.TARGET_GOOS}}" --goarch "{{.TARGET_ARCH}}"
    env:
      GOOS: '{{.TARGET_GOOS}}'
      GOARCH: '{{.TARGET_ARCH}}'
      CGO_ENABLED: 0

  extract:proto:
    summary: Extract proto from Cursor extension snapshot
    dir: '{{.ROOT_DIR}}'
    preconditions:
      - sh: 'test -z "{{.PROTO_INPUT}}" || test -f "{{.PROTO_INPUT}}"'
        msg: "Cursor extension bundle specified by PROTO_INPUT does not exist."
      - sh: 'test -n "{{.PROTO_INPUT}}" || test -f ./proto/extensions-cursor-app/cursor-always-local/dist/main.js || test -f /Applications/Cursor.app/Contents/Resources/app/extensions/cursor-always-local/dist/main.js'
        msg: "Cursor extension bundle not found; please pass PROTO_INPUT=/path/to/cursor-always-local/dist/main.js."
    cmds:
      - chmod +x ./proto/extract_extensions_proto.sh
      - '{{if .PROTO_INPUT}}./proto/extract_extensions_proto.sh "{{.PROTO_INPUT}}"{{else}}./proto/extract_extensions_proto.sh{{end}}'

  sync:proto:
    summary: Sync proto from Cursor extension snapshot and regenerate Go code
    dir: '{{.ROOT_DIR}}'
    deps:
      - task: extract:proto
    cmds:
      - cp ./proto/from_extensions/agent_v1.proto ./proto/agent_v1.proto
      - cp ./proto/from_extensions/aiserver_v1.proto ./proto/aiserver_v1.proto
      - perl -0pi -e 's|option go_package = "react-admin/cursor-server/gen/agent/v1;agentv1";|option go_package = "cursor/gen/agentv1;agentv1";|' ./proto/agent_v1.proto
      - perl -0pi -e 's|option go_package = "react-admin/cursor-server/gen/aiserver/v1;aiserverv1";|option go_package = "cursor/gen/aiserverv1;aiserverv1";|' ./proto/aiserver_v1.proto
      - rm -rf ./gen/agentv1 ./gen/aiserverv1
      - task: generate:proto

  generate:proto:
    summary: Generate proto Go/Connect code
    dir: '{{.ROOT_DIR}}'
    sources:
      - proto/*.proto
    generates:
      - gen/agentv1/*.go
      - gen/aiserverv1/*.go
      - gen/aiserverv1/aiserverv1connect/*.go
    preconditions:
      - sh: protoc --version
        msg: "protoc not detected, please install Protocol Buffers compiler first."
      - sh: protoc-gen-go --version >/dev/null 2>&1 || which protoc-gen-go
        msg: "protoc-gen-go not detected, please install first."
      - sh: protoc-gen-connect-go --version >/dev/null 2>&1 || which protoc-gen-connect-go
        msg: "protoc-gen-connect-go not detected, please install first."
    cmds:
      - rm -rf ./gen/agentv1 ./gen/aiserverv1
      - protoc -I ./proto --go_out=. --go_opt=module=cursor --connect-go_out=. --connect-go_opt=module=cursor ./proto/agent_v1.proto ./proto/aiserver_v1.proto
      - gofmt -w $(find ./gen -name '*.go' -type f)

  go:mod:tidy:
    summary: Tidy Go dependencies
    internal: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies (Yarn)
    dir: '{{.ROOT_DIR}}/frontend'
    sources:
      - package.json
      - yarn.lock
    generates:
      - node_modules
    preconditions:
      - sh: yarn --version
        msg: "Yarn not detected, please install Yarn first."
    cmds:
      - yarn install --frozen-lockfile
      - python -c "import pathlib; (pathlib.Path('node_modules') / 'go.mod').write_text('module cursor/frontend/node_modules\n')"

  generate:bindings:
    label: generate:bindings (BUILD_FLAGS={{.BUILD_FLAGS}})
    summary: Generate frontend bindings (run common:generate:proto explicitly when proto files change)
    dir: '{{.ROOT_DIR}}'
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true

  build:frontend:
    label: build:frontend (DEV={{.DEV}} SCAN={{.SCAN}})
    summary: Build frontend assets
    dir: '{{.ROOT_DIR}}/frontend'
    sources:
      - "**/*"
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS: '{{.BINDINGS_BUILD_FLAGS | default ""}}'
    cmds:
      - yarn run {{.BUILD_COMMAND}}{{if eq .SCAN "true"}} --scan{{end}}
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'
    vars:
      BUILD_COMMAND: '{{if eq .DEV "true"}}build:dev{{else}}build{{end}}'
      SCAN: '{{.SCAN | default "false"}}'

  dev:frontend:
    summary: Start frontend dev service
    dir: '{{.ROOT_DIR}}/frontend'
    deps:
      - task: install:frontend:deps
    cmds:
      - yarn run dev --port {{.VITE_PORT}} --strictPort

  generate:icons:
    summary: Generate Windows and macOS icons using appicon.png
    dir: '{{.BUILD_DIR}}'
    sources:
      - "appicon.png"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  update:build-assets:
    summary: Update build assets based on config
    dir: '{{.BUILD_DIR}}'
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
      - rm -rf ios

  setup:docker:
    summary: Build Linux cross-compilation Docker image
    dir: '{{.ROOT_DIR}}'
    preconditions:
      - sh: docker info >/dev/null 2>&1
        msg: "No available Docker daemon detected, please start Docker first."
      - sh: test -f ./build/docker/Dockerfile.cross
        msg: "build/docker/Dockerfile.cross not found."
    cmds:
      - docker build --platform linux/amd64{{if .BASE_IMAGE}} --build-arg BASE_IMAGE="{{.BASE_IMAGE}}"{{end}}{{if .GO_TARBALL_URL}} --build-arg GO_TARBALL_URL="{{.GO_TARBALL_URL}}"{{end}} -t cursor-linux-amd64-cross -f ./build/docker/Dockerfile.cross ./build/docker
