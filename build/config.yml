version: "3"

# Build metadata (after updating, run: wails3 task common:update:build-assets)
info:
  companyName: "Cursor Helper"
  productName: "Cursor Helper"
  productIdentifier: "com.cursor.wuxianxubei"
  description: "Cursor Helper"
  copyright: "© 2026, Cursor Helper"
  comments: "Cursor Helper"
  version: "0.0.44"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

fileAssociations:

other:
  - name: Other Data
